[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
# Only crates this workspace depends on directly; AccessKit's zbus 5 stack is not ours to replace.
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "deny"
# Exactly what `cargo deny check bans` reports for rune's tree at the pinned rev (the older copy of
# each pair). Regenerate whenever the rune pin moves.
skip = [
    { crate = "foldhash@0.1.5" },
    { crate = "hashbrown@0.15.5" },
    { crate = "hashbrown@0.16.1" },
    { crate = "linux-raw-sys@0.4.15" },
    { crate = "miniz_oxide@0.8.9" },
    { crate = "rustc-hash@1.1.0" },
    { crate = "rustix@0.38.44" },
    { crate = "syn@2.0.119" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
]
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "libdbus-sys" },
    { name = "rune-kit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/anomalyco/rune"]
