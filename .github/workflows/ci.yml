name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "1"
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers fonts-inter fonts-ibm-plex
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: just gate
      - run: just hit-check
